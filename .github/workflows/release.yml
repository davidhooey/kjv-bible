name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ]; then
            KEYSTORE_FILE="$RUNNER_TEMP/kjvbible-release.p12"
            echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
            ./gradlew assembleRelease \
              -Pkjvbible.keystore="$KEYSTORE_FILE" \
              -Pkjvbible.storePassword="$STORE_PASSWORD" \
              -Pkjvbible.keyAlias="${KEY_ALIAS:-kjvbible}"
            rm -f "$KEYSTORE_FILE"
            cp app/build/outputs/apk/release/app-release.apk "kjv-bible-${{ steps.version.outputs.version }}.apk"
          else
            ./gradlew assembleRelease
            cp app/build/outputs/apk/release/app-release-unsigned.apk "kjv-bible-${{ steps.version.outputs.version }}.apk"
          fi

      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          name: KJV Bible ${{ steps.version.outputs.version }}
          files: kjv-bible-${{ steps.version.outputs.version }}.apk
          generate_release_notes: true
